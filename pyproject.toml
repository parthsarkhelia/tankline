[project]
name = "tankline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.1",
    "djangorestframework==3.18.1",
    "drf-spectacular==0.30.0",
    "gunicorn>=23",
    "numpy>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5",
    "requests>=2.32,<3",
    "shapely>=2.1,<3",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.18.1",
    "pylint>=4.0.10",
    "pylint-django>=2.8.0",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-django>=4.14",
    "responses>=0.25",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["."]
exclude = [".venv", "**/migrations", ".cache"]
venvPath = "."
venv = ".venv"

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings_test"
ignore-paths = ["^.*/migrations/.*$"]

[tool.pylint.format]
max-line-length = 110  # matches ruff

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",    # docstrings where they explain something; not one per file
    "missing-class-docstring",
    "missing-function-docstring",
    "abstract-method",             # read-only DRF serializers never implement create/update
    "too-few-public-methods",      # Django/DRF classes (Meta, AppConfig, serializers)
]
